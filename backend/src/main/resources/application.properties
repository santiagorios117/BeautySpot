spring.application.name=beautyspot

# ---------------------------------------------------------------------------
# Base de datos: H2 embebida (archivo local) por defecto -> el proyecto corre
# sin necesidad de instalar ni configurar un servidor de base de datos.
# Para usar MySQL en produccion, comenta el bloque H2 y descomenta el de MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/beautyspot;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (produccion) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/beautyspot_db?useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.org.springframework.security=INFO
